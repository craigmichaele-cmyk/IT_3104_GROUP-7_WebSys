<html>
    <h1>HTML Form</h1>

    <body>
        <form>
            <label for="firstname">First Name:</label>
            <input type="text" name="firstname" id="firstname">
        </form>

        <br>

        <form>
            <label for="lastname">Last Name:</label>
            <input type="text" name="lastname" id="lastname">
            </form>

        <br>

        <form>
            <label for="password">Password:</label>
            <input type="password" name="password" id="password">
            </form>
 
            <form>
                <button type="submit">Submit</button>

            <form>
            <button type="reset">Reset</button>

            <form>
            <button type="button">Click me!</button>

        </form>

        <br>

        <form>
            <label for="color">Color</label>
            <select id="colors">
                <option value="red">Red</option>
                <option value="black">Black</option>
                <option value="pink">Pink</option>
            </select>
        </form>

        <br>

        <h1>Check box</h1>
        <form>

        <input type="checkbox" id="char1" name="char1" value="Craig">
        <label for="char1">Craig</label><br>

        <input type="checkbox" id="char2" name="char2" value="Ely">
        <label for="char2">Ely</label><br>

        <input type="checkbox" id="char3" name="char3" value="Marco">
        <label for="char3">Marco</label><br>

        </form>

        <br>

        <h1>Tel</h1>
        <input type="tel" id="phone" pattern="[0-9]{4}-[0-9]{3}-[0-9]{4}">

        <br>

        

    </body>
</html>
